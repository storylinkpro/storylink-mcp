name: MCP Registry

# Publish server.json to the official MCP Registry (registry.modelcontextprotocol.io).
#
# Run this by hand (Actions > MCP Registry > Run workflow) after a release.
# The registry checks that the npm package version in server.json exists and
# declares the same mcpName. npm releases from publish.yml wait for a manual
# approval, so this workflow does not run on the tag.
#
# GitHub OIDC signs in to the registry as the storylinkpro org, which owns the
# io.github.storylinkpro/* namespace. No token is stored here.

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # mcp-publisher v1.8.4, linux_amd64. The SHA-256 comes from the release's checksums file.
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: server.json matches package.json
        run: |
          test "$(jq -r .version server.json)" = "$(jq -r .version package.json)"
          test "$(jq -r '.packages[0].version' server.json)" = "$(jq -r .version package.json)"
          test "$(jq -r .name server.json)" = "$(jq -r .mcpName package.json)"
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
