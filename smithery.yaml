# Smithery (https://smithery.ai)
#
# Storylink hosts this server. Smithery does not build or run it, so this
# file has no build or start configuration.
#
# Smithery lists a hosted server by its URL:
#
#   smithery mcp publish "https://storylink.pro/mcp" -n @storylinkpro/storylink
#
# The server uses Streamable HTTP and a Storylink API key (sl_live_…).
# Smithery keeps the Authorization header for itself, so send the key in
# the X-Storylink-Api-Key header. If both headers reach Storylink,
# Authorization wins, so the gateway must not forward its own bearer.
# "Sign in with Storylink" (OAuth) is not available yet.
